<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>투표 진행 리모컨</title>
<style>
  body { margin:0; background:#0f1b2d; color:#e6ebf2; font-family:'Noto Sans KR',system-ui,sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:18px; }
  h1 { font-size:20px; margin:4px 0 14px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid #3b4b66; background:#16243b; color:#fff; font-size:16px; box-sizing:border-box; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  button { padding:16px 10px; border-radius:12px; border:1px solid #3b4b66; background:#24324a; color:#fff; font-size:17px; font-weight:700; }
  button:active { background:#d4a24c; color:#0f1b2d; }
  button.wide { grid-column:1 / -1; }
  button.warn { background:#4a2630; border-color:#7a3a46; }
  .q { display:block; width:100%; text-align:left; margin:6px 0; font-weight:400; font-size:15px; }
  .q.on { border-color:#d4a24c; background:rgba(212,162,76,.2); }
  .st { font-size:14px; color:#97a3b5; margin:10px 0; line-height:1.6; }
  .st b { color:#f8f1e5; }
  .err { color:#ffb4a8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎛️ 투표 진행 리모컨</h1>
  <input id="key" type="password" placeholder="진행자 키 (ADMIN_KEY)" autocomplete="off">
  <div class="st" id="st">불러오는 중…</div>
  <div class="row">
    <button data-a="prev">◀ 이전 문항</button><button data-a="next">다음 문항 ▶</button>
    <button data-a="open">▶ 열기</button><button data-a="close">⏸ 마감</button>
    <button data-a="end" class="wide">대기 화면 (QR만 보이기)</button>
  </div>
  <div id="qs"></div>
  <div class="row"><button data-a="reset" class="warn wide">전체 초기화 (모든 표 삭제)</button></div>
</div>
<script>
(() => {
  const keyIn = document.getElementById('key');
  try { keyIn.value = localStorage.getItem('lp.adminKey') || new URLSearchParams(location.search).get('key') || ''; } catch (e) {}
  keyIn.addEventListener('change', () => { try { localStorage.setItem('lp.adminKey', keyIn.value); } catch (e) {} });
  const stEl = document.getElementById('st'), qsEl = document.getElementById('qs');
  let st = null, questions = [];

  async function act(action, q) {
    if (action === 'reset' && !confirm('모든 투표 결과를 지우고 처음부터 시작할까요?')) return;
    try { localStorage.setItem('lp.adminKey', keyIn.value); } catch (e) {}
    const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: keyIn.value, action, q }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) stEl.innerHTML = '<span class="err">' + (j.error || '실패') + '</span>';
    poll();
  }
  document.querySelectorAll('button[data-a]').forEach((b) => b.addEventListener('click', () => act(b.dataset.a)));
  qsEl.addEventListener('click', (e) => { const b = e.target.closest('.q'); if (b) act('goto', +b.dataset.q); });

  async function poll() {
    try {
      st = await (await fetch('/api/state?results=1', { cache: 'no-store' })).json();
      if (st.question) questions[st.current] = st.question.title;
      const c = st.counts || [];
      stEl.innerHTML = st.current < 0 ? '현재: <b>대기 화면</b>' :
        `현재: <b>Q${st.current + 1}</b> · ${st.open ? '🟢 투표 중' : '⏸ 마감'} · 참여 <b>${c.reduce((a, b) => a + b, 0)}명</b> (${c.join(' / ')})`;
      qsEl.innerHTML = Array.from({ length: st.total }, (_, i) => `<button class="q${i === st.current ? ' on' : ''}" data-q="${i}">Q${i + 1}${questions[i] ? ' · ' + questions[i] : ''}</button>`).join('');
    } catch (e) { stEl.innerHTML = '<span class="err">연결 실패</span>'; }
  }
  poll(); setInterval(poll, 2000);
})();
</script>
</body>
</html>
